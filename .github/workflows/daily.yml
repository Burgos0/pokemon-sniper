name: pokemon sniper daily

on:
  schedule:
    # TCGCSV refreshes around 20:00 UTC; run after it. Fetches are dated by
    # TCGCSV's last-updated timestamp, so the exact time does not matter.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit site/dashboard.json, publish DB snapshot releases
  pages: write
  id-token: write

# Serialize runs so two overlapping triggers can never race to restore or
# publish the DB snapshot at the same time. Queue rather than cancel.
concurrency:
  group: pokemon-sniper-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python packages
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y p7zip-full

      # Without a verified snapshot nothing else runs: never trade on, or
      # publish, an empty database.
      - name: restore latest database snapshot
        id: restore_snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.restore_snapshot

      # Load any missed days of the last two weeks from TCGCSV's archives
      # (each archive is downloaded only if its date is not already loaded).
      - name: fill recent gaps from archive
        id: fill_gaps
        continue-on-error: true
        run: |
          python -m scripts.backfill_archive --skip-metadata --start "$(date -u -d '14 days ago' +%F)"

      - name: fetch pokemon prices
        id: fetch
        continue-on-error: true
        run: |
          python -m scripts.fetch_prices

      - name: run trading step
        id: trade
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python -m scripts.run_trading_step

      # Publish whatever was restored and updated, even if trading failed,
      # so a fetched day is never lost.
      - name: publish database snapshot
        id: publish_snapshot
        if: always() && steps.restore_snapshot.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.publish_snapshot --source-commit "${{ github.sha }}"

      # Only build and deploy a page from a day that fetched, traded and was
      # saved; otherwise the previous page stays up rather than a stale one.
      - name: build dashboard
        id: build
        if: steps.trade.outcome == 'success' && steps.publish_snapshot.outcome == 'success'
        run: |
          python -m scripts.build_dashboard

      - name: commit dashboard.json
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/dashboard.json
          if git diff --cached --quiet; then
            echo "dashboard.json unchanged"
          else
            git commit -m "Daily dashboard data $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.build.outcome == 'success'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outcome == 'success'
        with:
          path: site

      - name: deploy to GitHub Pages
        id: deploy
        if: steps.build.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: fail loudly if any step failed
        if: always()
        run: |
          echo "restore=${{ steps.restore_snapshot.outcome }} fill_gaps=${{ steps.fill_gaps.outcome }} fetch=${{ steps.fetch.outcome }} trade=${{ steps.trade.outcome }} publish=${{ steps.publish_snapshot.outcome }} build=${{ steps.build.outcome }} deploy=${{ steps.deploy.outcome }}"
          for outcome in "${{ steps.restore_snapshot.outcome }}" "${{ steps.fill_gaps.outcome }}" \
                         "${{ steps.fetch.outcome }}" "${{ steps.trade.outcome }}" \
                         "${{ steps.publish_snapshot.outcome }}" "${{ steps.build.outcome }}" \
                         "${{ steps.deploy.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              echo "::error::A daily step did not succeed (see outcomes above)."
              exit 1
            fi
          done
